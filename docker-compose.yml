services:
    app:
        build: .
        restart: always
        tty: true
        container_name: ${SERVICE_NAME:-repair-business-app-development}
        ports:
            - "${SERVICE_PORT:-8000}:80"
        volumes:
            - .:/var/www
            - /var/www/vendor
            - /var/www/storage
            - /var/www/public
            - /var/www/bootstrap/cache
        env_file:
            - .env
        networks:
            - app_network

    client:
        image: node:20-alpine
        tty: true
        container_name: ${CLIENT_NAME:-repair-business-client}
        working_dir: /app
        command: sh -c "npm install && exec npm run dev -- --host 0.0.0.0"
        ports:
            - "${CLIENT_PORT:-5173}:5173"
        volumes:
            - ./client:/app
        networks:
            - app_network

networks:
  app_network:
    name: ${NETWORK_NAME:-default}
    external: true
